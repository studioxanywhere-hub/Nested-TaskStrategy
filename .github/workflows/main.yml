name: "Build Nested: Task Strategy (APK and AAB)"

on:
  push:
    branches: [ main, master, 'review/*' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_tag:
        description: "New Version Tag (e.g. v2.2.0). Leave blank to update the latest active release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Android Scaffolding & Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.studioxanywhere --project-name=nested
          python3 scripts/configure_signing.py

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Play Store App Bundle (AAB)
        run: |
          set -o pipefail
          flutter build appbundle --release -v 2>&1 | tee bundle.log || {
            echo "====================== FAILURE DIAGNOSTICS ======================"
            grep -A 25 -B 5 "What went wrong:" bundle.log || tail -n 80 bundle.log
            echo "================================================================"
            ERR_MSG=$(grep -A 8 "What went wrong:" bundle.log | head -n 8 | tr '\n' ' ' | sed 's/"/\\"/g')
            if [ -z "$ERR_MSG" ]; then
              ERR_MSG=$(tail -n 10 bundle.log | tr '\n' ' ' | sed 's/"/\\"/g')
            fi
            echo "::error title=Bundle Build Failure::$ERR_MSG"
            exit 1
          }

      - name: Build Release APK
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee apk.log || {
            echo "====================== FAILURE DIAGNOSTICS ======================"
            grep -A 25 -B 5 "What went wrong:" apk.log || tail -n 80 apk.log
            echo "================================================================"
            ERR_MSG=$(grep -A 8 "What went wrong:" apk.log | head -n 8 | tr '\n' ' ' | sed 's/"/\\"/g')
            if [ -z "$ERR_MSG" ]; then
              ERR_MSG=$(tail -n 10 apk.log | tr '\n' ' ' | sed 's/"/\\"/g')
            fi
            echo "::error title=APK Build Failure::$ERR_MSG"
            exit 1
          }

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Logs
          path: |
            bundle.log
            apk.log
          if-no-files-found: ignore

      - name: Verify Official Release Signature
        run: |
          AAB="build/app/outputs/bundle/release/app-release.aab"
          echo "Verifying signing certificate of $AAB..."
          keytool -printcert -jarfile "$AAB"
          if keytool -printcert -jarfile "$AAB" | grep -i "Android Debug"; then
            echo "ERROR: Bundle was signed with Android Debug certificate! Failing build."
            exit 1
          fi
          echo "SUCCESS: Bundle is verified signed with official release key."

      - name: Verify Target API 36 and Debug Symbols in AAB
        run: |
          python3 scripts/verify_release_aab.py

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nested-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nested-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Debug Symbols Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nested-Debug-Symbols
          path: build/app/outputs/bundle/release/native-debug-symbols.zip
          if-no-files-found: warn

      - name: Publish New Version or Update Existing Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Determine target release tag
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TARGET_TAG="${{ github.event.inputs.version_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TARGET_TAG="${{ github.ref_name }}"
          else
            # Push to main without tag: find current latest release tag from GitHub
            TARGET_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo "")
            if [ -z "$TARGET_TAG" ]; then
              VERSION_FROM_PUBSPEC=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
              TARGET_TAG="v${VERSION_FROM_PUBSPEC}"
            fi
          fi

          echo "Target Release Tag: $TARGET_TAG"

          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          SYMBOLS="build/app/outputs/bundle/release/native-debug-symbols.zip"

          # 2. Check if release already exists on GitHub
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Release $TARGET_TAG exists. Updating binaries in-place (same release)..."
            gh release upload "$TARGET_TAG" "$APK" "$AAB" "$SYMBOLS" --clobber
            echo "Successfully updated $TARGET_TAG release assets."
          else
            echo "Release $TARGET_TAG does not exist. Creating new release entry..."
            gh release create "$TARGET_TAG" "$APK" "$AAB" "$SYMBOLS" \
              --title "Nested: Task Strategy $TARGET_TAG" \
              --generate-notes
            echo "Successfully published new release $TARGET_TAG."
          fi
